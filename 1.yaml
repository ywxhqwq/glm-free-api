# ============================================================
#  Nebula 本地服务端 - FlClash 配置 (只代理星穹铁道)
#
#  只把游戏的流量送到远端那台机器上的 mitmdump。
#  其它一切流量全部 DIRECT, 一个字节都不经过那台机器。
#
#  用法:
#    1.  FlClash → 配置 → 本地导入 → 选这个文件
#    2.  点一下, 让它成为当前配置
#    3.  模式选 "规则" (rule)  ← 这步必须做, 见下面说明
#    4.  确认对方机器上 启动服务端.bat 已经跑起来了
#    5.  开游戏
#
#  不玩了  : 切回你自己的订阅配置, 游戏改走官方服务器
#  临时直连: 把下面 "Nebula" 组切到 DIRECT, 不用换配置
#
#  注意: 不要运行 启动客户端代理.bat / 停止客户端代理.bat
#        它们直接改系统代理, 会跟 FlClash 抢, 两个都别开。
# ============================================================

mode: "rule"
#   你 FlClash 的 patchClashConfig 里现在是 "global",
#   会盖掉这里, 所以导入后记得在界面上手动点成 "规则"。
#   (你那个订阅配置有 45 条规则 + MATCH,国外网站,
#    本来也靠规则模式生效, 切回订阅时也保持规则模式就行)

# PROCESS-NAME 规则要生效必须开 (你的配置里也是 always)
find-process-mode: "always"

# 跟你现在 FlClash 的端口保持一致, 不要改
mixed-port: 7890
allow-lan: false

# ---- 远端节点: 跑 Nebula 服务端那台机器上的 mitmdump ----
# 对方 EasyTier 地址不是 10.126.126.5 就改这里
proxies:
  - name: "Nebula-Remote"
    type: "http"
    server: "10.126.126.5"
    port: 8080

# ---- 代理组: 在 FlClash 里随时可以切 ----
#   Nebula-Remote = 走本地服务端
#   DIRECT        = 直连官方服务器
proxy-groups:
  - name: "Nebula"
    type: "select"
    proxies:
      - "Nebula-Remote"
      - "DIRECT"

# ---- 规则 (从上往下, 先匹配先命中) ----
rules:
  # 1) 按进程名 —— PC 端 (Windows 上是 exe 名)
  - "PROCESS-NAME,xtlr,Nebula"
  - "PROCESS-NAME,xtlr.exe,Nebula"

  # 1b) 按进程名 —— 安卓端必须用【包名】, xtlr 在手机上永远匹配不上
  #     为什么安卓非加不可:
  #       EasyTier 占了 VPN 通道后会先拦走 DNS, FlClash 的
  #       dns-hijack 抢不到, 于是它只看到 IP 看不到域名,
  #       下面的 DOMAIN-SUFFIX 规则全部失效。
  #       安卓上唯一的可靠判据就是包名。
  #     查包名的两种方式:
  #       手机 设置 → 应用 → 星穹铁道 → 包名
  #       或者 root 后:  pm list packages | grep -i yostar
  #     查到后把包名填进下面这行, 并去掉行首的 "# "
  # - "PROCESS-NAME,com.yostar.hkrpg,Nebula"

  # 2) 按域名: 这 6 个是本地服务端实际拦截重定向的域名
  #    来源: Server\Runtime\ProxyServer\Nebula.py 里的 TARGET_DOMAINS
  - "DOMAIN-SUFFIX,yostarplat.com,Nebula"
  - "DOMAIN-SUFFIX,stargazer-games.com,Nebula"
  - "DOMAIN-SUFFIX,yostar.cn,Nebula"
  - "DOMAIN-SUFFIX,stellasora.global,Nebula"
  - "DOMAIN-SUFFIX,stellasora.kr,Nebula"
  - "DOMAIN-SUFFIX,stellasora.jp,Nebula"

  # 3) 兜底: 上面没匹配到的全部直连
  - "MATCH,DIRECT"
